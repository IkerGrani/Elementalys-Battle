<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Elementalys Beasts: Battle</title>
        <link rel="icon" href="../assets/images/icons/Elementalys Beasts - Logo.png" type="image/png">

        <link rel="stylesheet" href="../styles/colores.css">
        <link rel="stylesheet" href="../styles/menu.css">
        <link rel="stylesheet" href="../styles/combate.css">
        <script src="../src/combate/combate.js" type="module"></script>
    </head>

    <body>

        <!-- Capa de Fondo Dinámico -->
        <div class="menu-background"></div>

        <!-- Encabezado Principal -->
        <header>
            <div class="logo-container">
                <img src="../assets/images/icons/Elementalys Beasts - Logo.png" alt="Elementalys Beasts" id="logo">
            </div>
            <div class="title-container">
                <h1>Elementalys Beasts</h1>
                <h2>Battle</h2>
            </div>
        </header>

        <!-- CAMPO DE BATALLA -->
        <div id="battle"></div>

        <!-- CONTROL -->
        <div id="control">
            <div id="evento">El combate ha comenzado.</div>
            <div id="opciones">
                <div class="btnCombate" id="ataques">Luchar</div>
                <div class="btnCombate" id="cambiar">Cambiar</div>
                <div class="btnCombate" id="atk1" hidden>Ataque normal</div>
                <div class="btnCombate" id="atk2" hidden>Ataque elemental</div>
                <div class="btnCombate" id="volver" hidden>Volver</div>
            </div>
        </div>

        <!-- LOG (izquierda) -->
        <div id="log">
            <p>Turno 1 — El combate ha comenzado.</p>
        </div>

        <!-- TEAM (derecha, oculto hasta cambiar) -->
        <div id="team" hidden>
            <p>Tu equipo:</p>
        </div>

        <!-- Pie de Página -->
        <footer>
            <p>Elementalys Beasts: Battle &copy; 2026 - Versión Alpha 1.0</p>
        </footer>

    </body>

</html>
