<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Elementalys Beasts: Battle</title>
        <link rel="icon" href="../assets/images/icons/Elementalys Beasts - Logo.png" type="image/png">

        <!-- Styles -->
        <link rel="stylesheet" href="../styles/colores.css">
        <link rel="stylesheet" href="../styles/menu.css">
        <link rel="stylesheet" href="../styles/login.css">
        <!-- Fin Styles -->

        <script src="../src/login.js" type="module"></script>
    </head>

    <!-- Menu Principal -->
    <body>
        
        <!-- Capa de Fondo Dinámico -->
        <div class="menu-background"></div>

        <!-- Encabezado Principal -->
        <header>
            <div class="logo-container">
                <img src="../assets/images/icons/Elementalys Beasts - Logo.png" alt="Brazalete Sendokai" id="logo">
            </div>
            <div class="title-container">
                <h1>Elementalys Beasts</h1>
                <h2>Battle</h2>
            </div>
        </header>
        
        <section class="main-content">
            <div id="formulario">
                <div id="mostrar-formulario">
                    <button type="button" id="mostrar-login" class="btnFormulario activo">Login</button>
                    <button type="button" id="mostrar-registro" class="btnFormulario">Registrarse</button>
                </div>

                <form id="form-login">
                    <label for="usuario-login">Usuario</label>
                    <input type="email" id="usuario-login" name="usuario">

                    <label for="passwd-login">Contraseña</label>
                    <input type="password" id="passwd-login" name="passwd">

                    <button type="submit" class="btnLogin">Login</button>
                </form>

                <form id="form-registro" hidden>
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre">

                    <label for="mail">Correo electrónico</label>
                    <input type="email" id="mail" name="mail">

                    <label for="usuario-registro">Usuario</label>
                    <input type="text" id="usuario-registro" name="usuario">

                    <label for="passwd-registro">Contraseña</label>
                    <input type="password" id="passwd-registro" name="passwd">

                    <label for="passwd2">Confirmar contraseña</label>
                    <input type="password" id="passwd2" name="passwd2">

                    <button type="submit" class="btnLogin">Registrarse</button>
                </form>
            </div>
        </section>

        <!-- Pie de Página -->
        <footer>
            <p>Elementalys Beasts: Battle &copy; 2026 - Versión Alpha 1.0</p>
        </footer>

    </body>

</html>
