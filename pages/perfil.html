<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Elementalys Beasts: Mi perfil</title>
        <link rel="icon" href="../assets/images/icons/elementalys-beasts-logo.png" type="image/png">

        <!-- Styles -->
        <link rel="stylesheet" href="../styles/colores.css">
        <link rel="stylesheet" href="../styles/menu.css">
        <link rel="stylesheet" href="../styles/login.css">
        <link rel="stylesheet" href="../styles/perfil.css">
        <!-- Fin Styles -->

        <script src="../src/login/perfil.js" type="module"></script>
    </head>

    <!-- Menu Principal -->
    <body>
        
        <!-- Capa de Fondo Dinámico -->
        <div class="menu-background"></div>

        <!-- Encabezado Principal -->
        <header>
            <div class="logo-container">
                <img src="../assets/images/icons/elementalys-beasts-logo.png" alt="Brazalete Sendokai" id="logo">
            </div>
            <div class="title-container">
                <h1>Elementalys Beasts</h1>
                <h2>Battle</h2>
            </div>
        </header>
        
        <section class="main-content">
            <div id="formulario">
                <div id="mostrar-formulario">
                    <button type="button" class="btnFormulario activo">Editar Perfil</button>
                </div>

                <form id="form-perfil">
                    <label for="usuario-perfil">Nombre de usuario</label>
                    <input type="text" id="usuario-perfil" name="usuario" required>

                    <label for="mail-perfil">Correo electrónico</label>
                    <input type="email" id="mail-perfil" name="mail" readonly>

                    <label for="passwd-perfil">Contraseña</label>
                    <input type="password" id="passwd-perfil" value="********" readonly>

                    <label for="fecha-nacimiento-perfil">Fecha de Nacimiento</label>
                    <input type="date" id="fecha-nacimiento-perfil" name="fechaNacimiento">

                    <button type="submit" class="btnLogin">Guardar Cambios</button>
                    <button type="button" id="btn-volver" class="btnVolver">Volver</button>
                </form>
            </div>
        </section>

        <!-- Pie de Página -->
        <footer>
            <p>Elementalys Beasts: Battle &copy; 2026 - Versión Alpha 1.0</p>
        </footer>

    </body>

</html>
